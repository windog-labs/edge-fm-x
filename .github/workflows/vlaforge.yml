name: VLAForge

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e 'vlaforge[test]'
      - name: Test
        run: python -m pytest -q vlaforge/tests

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset host-cpu
      - name: Build
        run: cmake --build --preset host-cpu --parallel
      - name: Test
        run: ctest --preset host-cpu
