[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vlaforge"
version = "0.2.0.dev0"
description = "Stateful VLA invocation compiler and no-Python C++ runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "VLAForge contributors" }]
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8",
  "hypothesis>=6",
]
models = [
  "numpy>=1.26",
  "torch>=2.2",
]

[project.scripts]
vlaforge = "vlaforge.cli:main"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.data-files]
"share/vlaforge" = ["CMakeLists.txt"]
"share/vlaforge/cmake" = ["cmake/VLAForgeRuntimeConfig.cmake.in"]
"share/vlaforge/runtime" = [
  "runtime/*.c",
  "runtime/*.cpp",
]
"share/vlaforge/backends" = ["backends/*.cpp"]
"share/vlaforge/include/vlaforge/runtime" = [
  "include/vlaforge/runtime/*.h",
]
"share/vlaforge/include/vlaforge/backends" = [
  "include/vlaforge/backends/*.h",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["python"]
markers = [
  "cuda_aoti: opt-in CUDA AOTInductor C++ backend tests",
  "model: deterministic model-adapter tests",
  "real_model: opt-in tests that execute real checkpoints",
]
